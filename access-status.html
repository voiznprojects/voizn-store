<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />        <script>
            if (window.location.pathname.toLowerCase().endsWith('/access-status.html')) {
                window.location.replace('/access-status/' + window.location.search + window.location.hash);
            }
        </script>
        <title>VOIZN | Access Status</title>
        <meta name="description" content="View your current VOIZN private access status." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Oswald:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
                        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="stylesheet" href="/assets/css/style.css" />
    </head>
    <body data-page="access-status">
        <main class="auth-shell-upgraded compact-auth-shell">
            <section class="compact-auth-card reveal is-visible">
                <p class="auth-kicker">VOIZN / ACCESS STATUS</p>
                <h1 id="access-status-title">Pending approval</h1>
                <p id="access-status-copy" class="auth-copy">
                    We’re reviewing your access request. You’ll receive an email once approved.
                </p>
                <div class="entry-auth-actions">
                    <a class="entry-auth-submit" href="/signin/">Return To Sign In</a>
                    <a class="entry-secondary-button" href="/support/">Contact Support</a>
                </div>
            </section>
        </main>
        <script src="/assets/js/script.js"></script>
    </body>
</html>
