<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>VOIZN | Sign In</title>
        <meta name="description" content="Sign in to the private VOIZN early access website." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Oswald:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
                        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="shortcut icon" type="image/png" href="favicon.png" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body data-auth-page="true" data-page="signin">
        <main class="auth-page compact-auth-page">
            <section class="compact-auth-card">
                <div class="compact-auth-head">
                    <p class="eyebrow">VOIZN / Account Access</p>
                    <h1>Sign In</h1>
                    <p class="auth-copy">Welcome back. Sign in to continue into your VOIZN account and private member area.</p>
                </div>

                <form class="auth-form compact-auth-form" id="signin-form">
                    <label class="auth-field auth-field-minimal">
                        <span>Email</span>
                        <input id="signin-email" type="email" autocomplete="email" required />
                    </label>
                    <label class="auth-field auth-field-minimal">
                        <span>Password</span>
                        <input id="signin-password" type="password" autocomplete="current-password" required />
                    </label>
                    <a class="forgot-link forgot-link-stacked" href="reset-password.html">Forgot password?</a>
                    <p class="auth-message" id="signin-message" aria-live="polite"></p>
                    <button class="auth-button compact-auth-button sign-in-primary-button" type="submit">Enter Account</button>
                </form>

                <p class="compact-auth-switch-copy">
                    Don’t have an account?
                    <a href="signup.html">Sign up</a>
                </p>

            </section>
        </main>

        <script src="assets/js/script.js"></script>
    </body>
</html>
